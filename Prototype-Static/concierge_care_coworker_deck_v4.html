<!-- v4 reads only the sibling findings.json, remediation-plan.json and apply-log.json files.
     Serve Prototype-Static over HTTP (for example, VS Code Live Server); file:// cannot load the JSON files.
     Attribute and Remediate are read-only and omit null fields; Attribute also omits unavailable statuses.
     Fix approval is simulated per action with a 1.2-second delay; all actions must be approved to unlock Certify.
     Reject cancels approval. Restart clears approvals; JSON files are never written.
     Trace & Investigate simulates a 1.2-second delay and reads trace details by action_id from apply-log.json.
     Trace actions reveal Target below the red tracing button, then allow simulated approval; no live tools are run.
     Recognized trailing ticket metadata is shown as separate Root Cause and Confidence fields; the JSON stays unchanged.
     Completed approvals survive finding navigation and unchanged plan reloads; changed, rejected or retraced fixes lose approval.
     Certify lists all findings and unlocks when one is approved; its delayed download link is UI-only, not a generated CSV.
     Health workflow processing takes at least 3.6 seconds per step; Remediate reloads the plan even when already available.
     The entry dashboard contains 10 display-only sample runs, with 4 WKND Demo, 3 WKND Trendsetters and 3 Frescopa runs.
     History filters update the recent runs table, independently of the prototype-only setup selections.
     Sample history does not resume real runs, populate approval state, or change the findings loaded from JSON.
     Validate with: node --test Prototype-Static/concierge-care-analysis.test.mjs Prototype-Static/concierge-care-attribution.test.mjs -->

<div class="arch-lane"><h3>Practitioner workflow — proposed Phase 1</h3><div class="arch-nodes"><div class="node"><strong>Practitioner</strong><span>Marketer, content owner, customer success</span></div><div class="arrow">→</div><div class="node rednode"><strong>CX Enterprise Coworker</strong><span>Chat UI and orchestration surface</span></div><div class="arrow">→</div><div class="node rednode"><strong>Concierge Care skill / plugin</strong><span>Analyse → Attribute → Remediate → Certify; governance gates and audit decisions</span></div></div></div>
<div class="arch-lane"><h3>Skill calls governed capabilities / adapters</h3><div class="arch-nodes"><div class="node bluenode"><strong>CJA skills</strong><span>Conversation analytics / issue signals</span></div><div class="node bluenode"><strong>LangSmith API</strong><span>Trace events and response context</span></div><div class="node bluenode"><strong>AEM MCP</strong><span>Read source and locale tree; gated content actions</span></div><div class="node bluenode"><strong>Content AI MCP</strong><span>Intent / index / ingestion operations</span></div><div class="node bluenode"><strong>Composer skills</strong><span>Only capabilities exposed by Composer</span></div><div class="node bluenode"><strong>BC Evaluation</strong><span>Golden set and replay certification</span></div><div class="node bluenode"><strong>Custom MCP / adapters</strong><span>Manifest, audit, escalation where available</span></div></div></div>
<div class="arch-lane"><h3>Systems of record — connector access to validate</h3><div class="arch-nodes"><div class="node greenNode"><strong>CJA</strong><span>Conversation analytics</span></div><div class="node greenNode"><strong>LangSmith</strong><span>Trace observability</span></div><div class="node greenNode"><strong>AEM as a Cloud Service</strong><span>Source content and locale tree</span></div><div class="node greenNode"><strong>Content AI</strong><span>Index, intent, ingestion</span></div><div class="node greenNode"><strong>Brand Concierge</strong><span>KB, manifest, health / evaluation</span></div></div></div>
<div class="arch-lane"><h3>Data and control flow</h3><ol class="small" style="line-height:1.8;padding-left:20px;margin:0"><li><strong>Detect / trace:</strong> Coworker skill reads conversation analytics and trace evidence (CJA / LangSmith adapters).</li><li><strong>Attribute:</strong> compare answer, source content, locale, and retrieved/index evidence; identify one of five fault classes.</li><li><strong>Choose action:</strong> run a local reversible Tier 1 operation, request human approval for Tier 2 customer-facing writes, or escalate Tier 3 system-wide defects.</li><li><strong>Execute through connector:</strong> call only the authorized AEM / Content AI / Composer / custom MCP operation. This prototype does not call it.</li><li><strong>Certify:</strong> run BC Evaluation / golden set plus replayed live questions; record result and return status to Concierge Health.</li></ol></div>
<div class="arch-lane"><h3>Agent vs skill vs MCP</h3><div class="kv-grid"><div class="kv"><div class="label">PHASE 1</div><div class="value">Coworker skill/plugin. The Care logic runs as the practitioner workflow hosted by Coworker.</div></div><div class="kv"><div class="label">SEPARATE A2A AGENT?</div><div class="value">No, not in the deck’s Phase 1 design. Phase 2 describes an Agent Orchestrator/MCP/A2A endpoint for cross-agent attribution.</div></div><div class="kv"><div class="label">MCP?</div><div class="value">Yes, as a connector/tool integration pattern (AEM MCP, Content AI MCP, custom MCP); access and exact tool contracts need validation.</div></div><div class="kv"><div class="label">LIVE IN THIS DEMO?</div><div class="value">No. Every trace, connector response, approval and write is simulated in browser JavaScript.</div></div></div></div>
<div class="arch-lane"><h3>Build-vs-validate boundary</h3><div class="notice info"><strong>Build:</strong> Coworker skill/plugin workflow, five-fault classifier, approval policy, audit record, evidence aggregation, health report and connector orchestration.</div><div class="notice warning"><strong>Validate:</strong> Coworker access to AEM agents, Content AI, Composer and BC Evaluation; Brand Concierge manifest/KB API availability; identity scopes; supported write operations; CJA and LangSmith data permissions.</div><div class="notice danger"><strong>Never:</strong> put the Care workflow in the customer answer path, auto-publish customer-facing content, or autonomously change prompts/index mappings when blast radius is system-wide.</div></div>
</div><div class="footer-disclaimer">Source: attached Concierge-Care-Agent-Pitch-Deck-v3.pptx · slides 3–5, 9–10 and 14. Architecture is reconstructed from the pitch deck; all unverified items are explicitly called out. Phase 2 multi-agent attribution is outside this Phase 1 prototype.</div></div>`}
function history(){document.getElementById('crumb').textContent='Chats / Activity';let contents=state.history.length?state.history.map(h=>`<div class="list-row"><span class="ev-icon">◷</span><div class="meta"><strong>${esc(h.text)}</strong><small>${esc(h.caseName)} · ${esc(h.time)}</small></div><span class="tag">Local demo</span></div>`).join(''):`<div class="empty">No prototype activity yet.<br><button class="btn primary" style="margin-top:12px" data-nav="home">Start a Coworker chat</button></div>`;return `<div class="page"><div class="page-title"><div><h1>Chats & activity</h1><p>Local interaction history for this prototype session.</p></div><div class="actions"><button class="btn" data-action="export-audit">Export demo audit JSON</button><button class="btn" data-action="clear-history">Clear history</button></div></div><div class="card">${contents}</div><div class="notice warning">This is an in-browser demo audit trail only. It is not an enterprise audit log and is not persisted to an Adobe service.</div></div>`}

function draftPanel(c,approved){let d=draftDefaults[c.key];if(!d)return '';return `<div class="draft-heading">${c.key==='quality'?'PROMPT / GUARDRAIL PROPOSAL':'CONTENT DRAFT'} <span class="tag blue" style="margin-left:5px">Not published</span></div><div class="kv"><div class="label">TARGET · SIMULATED</div><div class="value">${esc(d.target)}</div></div><div class="notice warning"><strong>Before:</strong> ${esc(d.before)}</div><label class="small" for="draft-text"><strong>Proposed text</strong> · ${approved?'approved demo scope':'editable for review'}</label><textarea class="draft-editor" id="draft-text" ${approved?'readonly':''}>${esc(state.draft)}</textarea><div class="small muted" style="line-height:1.5"><strong>Source facts:</strong> ${esc(d.source)}</div>${approved?'':`<div class="inline-controls" style="margin-top:13px"><label class="small" for="approver">Demo approver</label><select id="approver"><option>${esc(state.approver)}</option></select><span class="small muted">Role selection illustrates authorization; no identity service is connected.</span></div>`}`}
function downloadAudit(){let bundle={prototype:'Concierge Care Agent · pitch deck v3',simulated:true,exportedAt:new Date().toISOString(),currentCase:state.current,stage:state.stage,approvedBy:state.approved?state.approver:null,certifiedDemoCases:[...state.resolved],events:state.history};let blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});let a=document.createElement('a');let u=URL.createObjectURL(blob);a.href=u;a.download='concierge-care-demo-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Demo audit JSON downloaded')}
function render(){let pages={home,investigation,health,architecture,history};document.querySelector('.topbar').hidden=state.page==='health';view.innerHTML=(pages[state.page]||home)();bind();if(state.page==='health')bindCareAnalysis();}
function bind(){let ed=document.getElementById('draft-text');if(ed)ed.addEventListener('input',()=>{state.draft=ed.value;state.reviewed=false;let ck=document.getElementById('review-confirm');if(ck)ck.checked=false;let ab=document.getElementById('approve-btn');if(ab)ab.disabled=true});let rc=document.getElementById('review-confirm');if(rc)rc.addEventListener('change',()=>{state.reviewed=rc.checked;document.getElementById('approve-btn').disabled=!rc.checked});view.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));view.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>startCase(b.dataset.case)));view.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));view.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.modal)));let form=document.getElementById('ask-form');if(form){let inp=document.getElementById('ask-input'),send=document.getElementById('send-btn');inp.addEventListener('input',()=>send.classList.toggle('ready',!!inp.value.trim()));inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();startFromPrompt(inp.value)}});form.addEventListener('submit',e=>{e.preventDefault();startFromPrompt(inp.value)});document.getElementById('attachment-button').onclick=()=>document.getElementById('local-attachment').click();document.getElementById('local-attachment').onchange=e=>{let f=e.target.files[0];if(f)toast(`Reference selected: ${f.name}. Stored nowhere; processing is not connected.`)};document.getElementById('model-button').onclick=()=>toast('Normal mode · demo workflow uses scripted responses, not a live model');document.getElementById('plan-toggle').addEventListener('click',e=>{e.currentTarget.classList.toggle('active');toast(e.currentTarget.classList.contains('active')?'Plan mode enabled for this demo':'Plan mode disabled')});}}
function startFromPrompt(text){let q=(text||'').toLowerCase();if(q.includes('health')||q.includes('overview')){logEvent('Opened Concierge Health from Coworker prompt');navigate('health');return}let key=q.includes('locale')||q.includes('german')||q.includes('french')||q.includes('translation')?'locale':q.includes('ingest')||q.includes('crawl')||q.includes('skipped')?'ingestion':q.includes('prompt')||q.includes('tone')||q.includes('quality')?'quality':q.includes('source')||q.includes('index')||q.includes('chunk')||q.includes('contradict')||q.includes('wrong return')?'index':'authoring';startCase(key,text.trim()||undefined)}
function action(name){const c=cases[state.current];if(name==='attribute'){state.stage='attribute';logEvent(`Trace evidence reviewed: ${c.name}`)}else if(name==='back-trace')state.stage='trace';else if(name==='remediate'){state.stage='remediate';logEvent(`Fault attributed: ${c.name}`)}else if(name==='approve'){if(!state.reviewed){toast('Review the draft and confirm the approval scope first');return}state.approved=true;logEvent(`Demo approval recorded by ${state.approver}: ${c.name}`);toast('Approval recorded in the local demo only')}else if(name==='reject'){state.approved=false;state.reviewed=false;state.actionDone=false;logEvent(`Demo change rejected: ${c.name}`);toast('Returned to author in simulated workflow')}else if(name==='execute'){if(!state.approved){toast('Approval is required');return}state.actionDone=true;state.stage='certify';logEvent(`Simulated gated write completed: ${c.name}`)}else if(name==='run-safe'){state.actionDone=true;state.stage='certify';logEvent(`Simulated Tier 1 re-ingestion: ${c.name}`)}else if(name==='escalate'){state.escalated=true;state.stage='escalated';logEvent(`Escalation bundle prepared: ${c.name}`)}else if(name==='owner-resolved'){state.ownerResolved=true;state.actionDone=true;state.stage='certify';logEvent(`Product owner resolution simulated: ${c.name}`);toast('Owner resolution simulated; certification is now available')}else if(name==='run-cert'){if(!state.actionDone){toast('Complete the approved action first');return}state.resolved.add(c.key);state.certDone=true;state.certFail=false;logEvent(`Certified in simulation: ${c.name}`);toast('Simulated evaluation passed')}else if(name==='simulate-fail'){state.resolved.delete(c.key);state.certFail=true;state.certDone=false;logEvent(`Evaluation failed in simulation: ${c.name}`);state.stage='attribute';toast('Failure captured; loop returned to Attribute')}else if(name==='restart-cert'){state.certDone=false;state.stage='certify'}else if(name==='export-audit'){downloadAudit();return}else if(name==='clear-history'){state.history=[];state.resolved.clear();document.getElementById('chat-count').textContent='0';document.getElementById('recent-label').textContent='No conversations yet';toast('Local activity cleared')}else if(name==='start-default'){startCase('locale');return}render()}
function openModal(kind){let c=cases[state.current]||cases.index;let title='Evidence details',body='';if(kind==='trace'){title='Conversation trace evidence';body=`<p><strong>Session:</strong> BC-DEMO-${Math.floor(10000+Math.random()*89999)} · <strong>Surface:</strong> Brand Concierge web · <strong>Locale:</strong> ${c.key==='locale'?'de-DE':'en-US'}</p><div class="codebox">USER: ${esc(c.question)}\nCONCIERGE: ${esc(c.observed)}\nTRACE LINK: simulated://langsmith/trace/cc-demo-1042\nSIGNAL: ${esc(c.signal)}\nNOTE: This is synthetic demo evidence, not a live trace.</div>${evidenceList(c)}`}else if(kind==='sources'){title='Source records (simulated)';body=`${evidenceList(c)}<div class="notice warning">Connectors and access are not configured in this standalone file. Manifest and KB API access are specifically called out for validation in the pitch deck.</div>`}else if(kind==='approval'){title='Review the exact proposed change';body=`<p><strong>Scenario:</strong> ${esc(c.name)}</p><p><strong>Change:</strong> ${esc(c.action)}</p><p><strong>Exact proposed text:</strong></p><div class="codebox">${esc(state.draft)}</div><p><strong>Target connector:</strong> ${esc(c.connector)}</p><p><strong>Gate:</strong> ${esc(c.approval)}</p><div class="codebox">${esc(c.remedy)}\n\nValidation required:\n- ${c.validation.map(esc).join('\n- ')}</div><div class="notice warning">Demo approval only. A production workflow must show a signed-in approver, scope, diff, permissions and audit ID.</div>`}else if(kind==='plan'){title='Tier 1 execution plan';body=`<ol><li>Confirm URL and source revision are approved.</li><li>Add skipped URL to ingestion allowlist.</li><li>Run re-ingest / re-index.</li><li>Re-run golden set and replayed questions.</li><li>Write action and evaluation result to audit history.</li></ol><div class="notice info">This operation is simulated and does not call Content AI.</div>`}else if(kind==='escalation'){title='Product escalation evidence bundle';body=`<div class="codebox">Fault class: ${esc(c.name)}\nTrace: simulated://langsmith/trace/cc-demo-1042\nAEM source revision: returns-policy-2026-04\nExpected value: 45 days\nRetrieved content: 30 days\nSuspected active collection: collection-v17\nManifest access: to validate\nRequested owner: Brand Concierge Product / Engineering\nRecommended action: inspect crawl, chunking, embedding and runtime mapping</div><div class="notice danger">No source content, prompt or runtime index will be modified.</div>`}else{title='Details';body='Simulated prototype interaction.'}document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="modal-close" id="close-modal">×</button></div><div class="modal-body">${body}<div class="actions" style="margin-top:16px"><button class="btn" id="done-modal">Close</button></div></div></div></div>`;document.getElementById('close-modal').onclick=closeModal;document.getElementById('done-modal').onclick=closeModal;document.getElementById('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav&&!view.contains(nav)){navigate(nav.dataset.nav)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
